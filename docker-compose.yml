services:
  mongodb:
    image: mongo:latest
    container_name: ai-agent-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: mypassword
    volumes:
      - mongodb_data:/data/db
    
  redis:
    image: redis:latest
    container_name: ai-agent-redis
    ports:
      - "6379:6379"

volumes:
  mongodb_data: